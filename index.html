<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo List Dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="js/app.js" defer></script>
</head>
<body>

  <!-- Theme Toggle -->
  <header class="app-header">
    <button id="theme-toggle" type="button" aria-label="Toggle light/dark theme">
      Toggle Theme
    </button>
  </header>

  <main class="dashboard">

    <!-- Greeting Panel -->
    <section class="panel" id="greeting-panel" aria-label="Greeting Panel">
      <p id="greeting-time" aria-live="polite"></p>
      <p id="greeting-date"></p>
      <p id="greeting-text" aria-live="polite"></p>
      <form id="greeting-name-form" novalidate>
        <label for="greeting-name-input">Your name</label>
        <input
          id="greeting-name-input"
          type="text"
          name="name"
          maxlength="50"
          placeholder="Enter your name"
          autocomplete="off"
        />
        <button type="submit">Save</button>
        <span id="greeting-name-error" role="alert" class="error-msg"></span>
      </form>
    </section>

    <!-- Focus Timer -->
    <section class="panel" id="timer-panel" aria-label="Focus Timer">
      <h2>Focus Timer</h2>
      <p id="timer-display" aria-live="assertive" aria-atomic="true">25:00</p>
      <div class="timer-controls">
        <button id="timer-start" type="button">Start</button>
        <button id="timer-stop" type="button">Stop</button>
        <button id="timer-reset" type="button">Reset</button>
      </div>
      <div id="timer-notification" aria-live="assertive"></div>
    </section>

    <!-- Todo List -->
    <section class="panel" id="todo-panel" aria-label="Todo List">
      <h2>Todo List</h2>
      <form id="todo-form" novalidate>
        <label for="todo-input">New task</label>
        <input
          id="todo-input"
          type="text"
          name="task"
          maxlength="500"
          placeholder="Add a task…"
          autocomplete="off"
        />
        <button type="submit">Add</button>
        <span id="todo-error" role="alert" class="error-msg"></span>
      </form>
      <ul id="todo-list" aria-label="Task list"></ul>
    </section>

    <!-- Quick Links -->
    <section class="panel" id="links-panel" aria-label="Quick Links">
      <h2>Quick Links</h2>
      <form id="links-form" novalidate>
        <label for="links-label-input">Label</label>
        <input
          id="links-label-input"
          type="text"
          name="label"
          placeholder="Site name"
          autocomplete="off"
        />
        <label for="links-url-input">URL</label>
        <input
          id="links-url-input"
          type="url"
          name="url"
          placeholder="https://example.com"
          autocomplete="off"
        />
        <button type="submit">Add Link</button>
        <span id="links-error" role="alert" class="error-msg"></span>
      </form>
      <ul id="links-list" aria-label="Quick links list"></ul>
    </section>

  </main>

</body>
</html>
